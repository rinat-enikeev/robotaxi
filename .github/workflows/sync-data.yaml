name: Sync Data

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-staging:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install --disable-pip-version-check --no-cache-dir pyyaml

      - name: Generate seed SQL from data
        run: ./scripts/generate_cities_seed.sh

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply seed data to Supabase (staging)
        env:
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          psql \
            --host="db.${{ secrets.STAGING_PROJECT_ID }}.supabase.co" \
            --port="5432" \
            --username="postgres" \
            --dbname="postgres" \
            --file="supabase/seeds/cities.sql" \
            --set="ON_ERROR_STOP=1" \
            --single-transaction

  sync-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install --disable-pip-version-check --no-cache-dir pyyaml

      - name: Generate seed SQL from data
        run: ./scripts/generate_cities_seed.sh

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply seed data to Supabase (production)
        env:
          PGPASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          psql \
            --host="db.${{ secrets.PRODUCTION_PROJECT_ID }}.supabase.co" \
            --port="5432" \
            --username="postgres" \
            --dbname="postgres" \
            --file="supabase/seeds/cities.sql" \
            --set="ON_ERROR_STOP=1" \
            --single-transaction
