name: Sync Data (Production)

on:
  workflow_run:
    workflows:
      - Release (Production)
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-production:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'Release (Production)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install --disable-pip-version-check --no-cache-dir pyyaml

      - name: Generate seed SQL from data
        run: ./scripts/generate_cities_seed.sh

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply seed data to Supabase (production)
        env:
          PGPASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          psql \
            --host="db.${{ secrets.PRODUCTION_PROJECT_ID }}.supabase.co" \
            --port="5432" \
            --username="postgres" \
            --dbname="postgres" \
            --file="supabase/seeds/seed.sql" \
            --set="ON_ERROR_STOP=1" \
            --single-transaction
